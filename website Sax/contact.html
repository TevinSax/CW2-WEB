    <section class="page-section">
        <h2>Contact & Booking</h2>
        <div class="contact-container">
            
            <!-- Contact Info -->
            <div class="contact-info">
                <h3>Get in Touch</h3>
                <p><strong>Phone/WhatsApp:</strong> <br>+256 701631808</p>
                <p><strong>Social Media:</strong></p>
                <div class="social-links">
                    <a href="#" target="_blank">TikTok (@TevinSax)</a><br>
                    <a href="#" target="_blank">Instagram (@TevinSax)</a><br>
                    <a href="#" target="_blank">Facebook (@TevinSax)</a><br>
                </div>
            </div>

            <!-- Booking Form -->
            <div class="contact-form">
                <h3>Book Tevin</h3>
                <form id="bookingForm">
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>
                    <input type="tel" placeholder="Phone Number" required>
                    <select required>
                        <option value="" disabled selected>Event Type</option>
                        <option value="Wedding">Wedding</option>
                        <option value="Birthday">Birthday</option>
                        <option value="Proposal">Marriage Proposal</option>
                        <option value="Concert">Concert</option>
                        <option value="Other">Other</option>
                    </select>
                    <textarea rows="4" placeholder="Tell us about your event and date..." required></textarea>
                    <button type="submit" class="btn">Send Booking Request</button>
                </form>
            </div>

        </div>
    </section>
